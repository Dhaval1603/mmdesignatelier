let selected=[],step=0,data={},previews={};const app=document.querySelector('#app');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function steps(){return ['choose',...selected,'contact','review']};function key(s,f){return s+'_'+f[0]};
function field(service,f){let [id,label,type,opts='',required=false,depends]=f;if(depends&&data[key(service,[depends])]!=='Yes')return '';let k=key(service,f),v=data[k]||'',req=required?'required':'';
 if(type==='checks'){let values=v?String(v).split('|'):[], choices=opts.split('|'), icon=x=>`<svg viewBox="0 0 24 24" aria-hidden="true">${x}</svg>`, glyph={"Living Room":icon('<path d="M3 15v-4h18v4M5 11V8h5v3m4 0V8h5v3M5 15v3m14-3v3"/>'),"Dining Room":icon('<path d="M3 10h18M5 10v9m14-9v9M8 10V5m8 5V5M6 5h4m4 0h4"/>'),"Kitchen":icon('<rect x="5" y="4" width="14" height="16" rx="1"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><path d="M8 15h8"/>'),"Master Bedroom":icon('<path d="M3 15v-5h18v5M5 10V7h5v3m4 0V7h5v3M3 15v4m18-4v4"/>'),"Bedroom":icon('<path d="M3 15v-5h18v5M5 10V7h5v3m4 0V7h5v3M3 15v4m18-4v4"/>'),"Kids Bedroom":icon('<circle cx="12" cy="12" r="4"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="7" r="2"/><path d="M9 14c2 2 4 2 6 0M10 11h.01M14 11h.01M8 19l2-3m6 3-2-3"/>'),"Guest Bedroom":icon('<path d="M3 15v-5h18v5M5 10V7h5v3m4 0V7h5v3M3 15v4m18-4v4"/>'),"Bathroom":icon('<path d="M12 4a4 4 0 0 1 4 4v2M7 11h10M9 11v2m3-2v2m3-2v2M6 18h12"/><path d="M16 5l2 2"/>'),"Pooja Room":icon('<path d="M12 4c2 4 5 5 7 6-2 4-5 6-7 9-2-3-5-5-7-9 2-1 5-2 7-6Z"/><path d="M12 5v12M7 10c2 1 3 2 5 4m5-4c-2 1-3 2-5 4"/>'),"Study Room":icon('<path d="M4 5h6c1 0 2 1 2 2v12c0-1-1-2-2-2H4V5Zm16 0h-6c-1 0-2 1-2 2v12c0-1 1-2 2-2h6V5Z"/>'),"TV Unit":icon('<rect x="4" y="5" width="16" height="11" rx="1"/><path d="M9 20h6m-3-4v4"/>'),"Foyer":icon('<path d="M6 3h10v18H6V3Zm3 9h.01M3 21h18"/>'),"Balcony":icon('<path d="M5 4v16m14-16v16M5 9h14M8 9v11m4-11v11m4-11v11M3 20h18"/>'),"Utility":icon('<rect x="5" y="3" width="14" height="18" rx="1"/><circle cx="12" cy="14" r="4"/><path d="M8 7h.01M11 7h2"/>'),"Other":icon('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>')};if(service==='interior'&&id==='style')return `<div class="full" ${required?`data-required-group="${k}"`:''}><label>${label}${required?' *':''}</label><div class="style-grid">${choices.map(o=>{let slug=o.toLowerCase().replace(/\s+/g,'-');return `<label class="style-choice ${values.includes(o)?'selected':''}"><input data-k="${k}" type="checkbox" value="${o}" ${values.includes(o)?'checked':''}><span class="style-photo" style="background-image:url('mm-style-${slug}.png')"></span><span>${o}</span></label>`}).join('')}</div></div>`;return `<div class="full" ${required?`data-required-group="${k}"`:''}><label>${label}${required?' *':''}</label><div class="choice-grid space-grid">${choices.map(o=>`<label class="choice ${values.includes(o)?'selected':''}"><input data-k="${k}" type="checkbox" value="${o}" ${values.includes(o)?'checked':''}><span class="space-icon">${glyph[o]||glyph.Other}</span><span>${o}</span></label>`).join('')}</div></div>`}
 if(type==='yesno')return `<div ${required?`data-required-group="${k}"`:''}><label>${label}${required?' *':''}</label><div class="yesno ${id==='floorPlan'||id==='sitePlan'?'yesno-compact':''}">${['Yes','No'].map(o=>`<label><input data-k="${k}" type="radio" name="${k}" value="${o}" ${v===o?'checked':''}> ${o}</label>`).join('')}</div></div>`;
 if(type==='file'){let paired=id==='images'||id==='videos', thumbs=(previews[k]||[]).map((x,n)=>`<span class="preview-item">${x.type.startsWith('image/')?`<img src="${x.url}" alt="Selected image">`:`<span class="video-preview">▶<small>${esc(x.name)}</small></span>`}<button type="button" data-remove-preview="${k}" data-preview-index="${n}" aria-label="Remove ${esc(x.name)}">×</button></span>`).join('');return `<div class="${paired?'upload-pair':'full'}"><label>${label}</label><div class="upload"><div class="upload-copy"><input data-k="${k}" type="file" multiple><span>Add files</span></div><div class="upload-preview">${thumbs}</div></div></div>`}
 let [actual,unit]=type.split(':');if(actual==='select')return `<div><label>${label}${required?' *':''}</label><select data-k="${k}" ${req}><option value="">Select an option</option>${opts.split('|').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
 if(actual==='textarea')return `<div class="full"><label>${label}</label><textarea data-k="${k}">${esc(v)}</textarea></div>`;
 return `<div class="${unit?'unit':''}"><label>${label}${required?' *':''}</label><input data-k="${k}" type="${actual}" value="${esc(v)}" ${req}>${unit?`<em>${unit}</em>`:''}</div>`}
function servicePage(id){let s=services[id]||contact, isContact=id==='contact', title=isContact?'Let’s begin a conversation.':`Tell us about your <em>${s.name.toLowerCase()} vision.</em>`;return `<div class="studio-form"><div class="studio-main"><div class="studio-intro"><div class="eyebrow">${s.name}</div><h1>${title}</h1><p>${isContact?'Share your preferred details and our studio will be in touch shortly.':'Share a few details about your space and design preferences. We’ll use them to understand your vision and create a tailored experience for you.'}</p></div>${s.sections.map((x,n)=>`<section class="studio-section"><div class="section-no">${String(n+1).padStart(2,'0')}</div><div><h3>${x.title}</h3><p class="section-note">${n===0?'Help us understand your project requirements.':'Tell us more about your preferences.'}</p><div class="form-grid">${x.fields.map(f=>field(id,f)).join('')}</div></div></section>`).join('')}</div><aside class="studio-aside"><div class="aside-image ${services[id]?id:'interior'}"></div><div class="aside-message">A BETTER<br>DESIGN<br>BEGINS WITH<br>A CONVERSATION.<strong>“</strong></div></aside></div>`}
function render(){let all=steps(),current=all[step],pct=(step/(all.length-1))*100;document.querySelector('#bar').style.width=pct+'%';document.querySelector('#stepLabel').textContent=`Step ${step+1} of ${all.length}`;
 document.body.classList.toggle('hero-step',current==='choose');document.body.classList.toggle('studio-page',current!=='choose'&&current!=='review');let html='';if(current==='choose')html=`<div class="hero-selection"><div class="hero-kicker">LET’S CREATE TOGETHER</div><h1 class="hero-title">What are you <em>looking for?</em></h1><p class="hero-copy">Select a service to begin your project inquiry. Every detail that follows will be tailored to your project.</p><div class="hero-grid">${Object.entries(services).map(([id,s])=>`<label class="hero-card ${id}" aria-label="Open ${s.name} inquiry"><input type="radio" name="service" data-service="${id}"><span class="card-content"><strong>${s.name.toUpperCase()}</strong><p>${s.desc}</p><span class="card-open">EXPLORE</span></span></label>`).join('')}</div><div id="error" class="hero-error"></div></div>`;
 else if(current==='review')html=review();else html=servicePage(current);
 html+=current!=='review'&&current!=='choose'?`<div class="actions"><button class="button ghost ${step?'':'hidden'}" id="back">← BACK</button><span></span><button class="button" id="next">${step===all.length-2?'REVIEW INQUIRY →':'CONTINUE →'}</button></div>`:'';app.innerHTML=html;bind();}
function review(){let h=`<h1>Review your inquiry</h1><p class="intro">Please check the information below before submitting. You can go back to edit any part.</p>`;for(let id of [...selected,'contact']){let s=services[id]||contact, items=[];s.sections.forEach(x=>x.fields.forEach(f=>{let v=data[key(id,f)];if(v&&f[2]!=='file')items.push(`<dt>${f[1]}</dt><dd>${esc(v)}</dd>`)}));if(items.length)h+=`<div class="review"><h3>${s.name}</h3><dl>${items.join('')}</dl></div>`}return h+`<div class="actions"><button class="button ghost" id="back">← BACK</button><button class="button" id="submit">SUBMIT INQUIRY →</button></div>`}
function bind(){document.querySelectorAll('[data-service]').forEach(el=>el.onchange=()=>{let id=el.dataset.service;if(document.body.classList.contains('hero-step')){selected=[id];step=1;render();return}if(el.checked)selected.push(id);else{selected=selected.filter(x=>x!==id);Object.keys(data).filter(k=>k.startsWith(id+'_')).forEach(k=>delete data[k])}render()});document.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{let k=el.dataset.k;if(el.type==='checkbox'){let cur=(data[k]||'').split('|').filter(Boolean);data[k]=el.checked?[...cur,el.value].join('|'):cur.filter(x=>x!==el.value).join('|');render()}else if(el.type==='file'){let additions=Array.from(el.files).map(x=>({name:x.name,type:x.type,url:URL.createObjectURL(x)}));previews[k]=[...(previews[k]||[]),...additions];data[k]=previews[k].map(x=>x.name).join(', ');render()}else{data[k]=el.value;if(el.type==='radio')render()}});document.querySelectorAll('[data-remove-preview]').forEach(btn=>btn.onclick=()=>{let k=btn.dataset.removePreview,n=Number(btn.dataset.previewIndex),item=previews[k]?.[n];if(item?.url)URL.revokeObjectURL(item.url);previews[k].splice(n,1);data[k]=previews[k].map(x=>x.name).join(', ');render()});let back=document.querySelector('#back');if(back)back.onclick=()=>{step--;render()};let next=document.querySelector('#next');if(next)next.onclick=()=>advance();let submit=document.querySelector('#submit');if(submit)submit.onclick=submitForm}
function advance(){if(step===0&&!selected.length){document.querySelector('#error').textContent='Please choose at least one service to continue.';return}let invalid=[...app.querySelectorAll('[required]')].find(x=>!x.value);let group=[...app.querySelectorAll('[data-required-group]')].find(x=>!data[x.dataset.requiredGroup]);if(invalid||group){(invalid||group).scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('.error')?.remove();(invalid||group).insertAdjacentHTML('beforebegin','<p class="error">Please complete the required fields marked with *.</p>');return}step++;render()}
function submitForm(){let payload={};selected.forEach(s=>{payload[s]={};Object.keys(data).filter(k=>k.startsWith(s+'_')).forEach(k=>payload[s][k.slice(s.length+1)]=data[k])});payload.contact={};Object.keys(data).filter(k=>k.startsWith('contact_')).forEach(k=>payload.contact[k.slice(8)]=data[k]);console.log('MM Design Atelier inquiry',payload);document.querySelector('#stepLabel').textContent='Inquiry sent';document.querySelector('#bar').style.width='100%';app.innerHTML=`<div class="success"><div><div class="mark">MM</div><h1>Thank You</h1><p>Your requirements have been successfully submitted to MM DESIGN ATELIER. Our team will review your requirements and contact you shortly.</p><p class="note">Your inquiry is organised securely by the services you selected.</p></div></div>`}
render();
</script></body></html>
